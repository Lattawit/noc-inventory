services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: noc
      POSTGRES_PASSWORD: nocpass
      POSTGRES_DB: noc_inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noc -d noc_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://noc:nocpass@db:5432/noc_inventory
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  pgdata:
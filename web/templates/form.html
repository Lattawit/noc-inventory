{% extends "base.html" %}
{% block content %}
<h4>{{ 'Edit' if device else 'Add' }} device</h4>
<<form method="post" class="panel p-4" style="max-width:600px">
  <div class="mb-3">
    <label class="form-label">Hostname</label>
    <input name="hostname" class="form-control" required value="{{ device.hostname if device else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">IP address</label>
    <input name="ip_address" class="form-control" required value="{{ device.ip_address if device else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Type</label>
    <select name="device_type" class="form-select">
      {% for t in types %}
      <option {{ 'selected' if device and device.device_type == t }}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Vendor</label>
    <input name="vendor" class="form-control" value="{{ device.vendor or '' if device else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">VLAN</label>
    <input name="vlan" type="number" class="form-control" value="{{ device.vlan or '' if device else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Location</label>
    <select name="location_id" class="form-select">
      <option value="">-- none --</option>
      {% for l in locations %}
      <option value="{{ l.id }}" {{ 'selected' if device and device.location_id == l.id }}>{{ l.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Status</label>
    <select name="status" class="form-select">
      <option {{ 'selected' if device and device.status == 'up' }}>up</option>
      <option {{ 'selected' if device and device.status == 'down' }}>down</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control">{{ device.notes or '' if device else '' }}</textarea>
  </div>
  <<button class="btn btn-noc">Save</button>
  <a href="/" class="btn btn-link">Cancel</a>
</form>
{% endblock %}

<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOC Device Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block head %}{% endblock %}
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2e;
      --line: #1f2b46;
      --cyan: #22d3ee;
      --green: #22c55e;
      --red: #ef4444;
      --muted: #7d8bab;
    }
    body { background: var(--bg); color: #d6deee; font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .topbar { background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { letter-spacing: .08em; font-weight: 600; color: var(--cyan) !important; }
    .brand small { color: var(--muted); font-weight: 400; }
    .clock { color: var(--muted); font-size: .9rem; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: .6rem; }
    .stat { padding: 1rem 1.25rem; }
    .stat .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; }
    .stat .value { font-size: 2rem; font-weight: 700; line-height: 1.2; }
    .stat.up .value { color: var(--green); }
    .stat.down .value { color: var(--red); }
    .stat.pct .value { color: var(--cyan); }
    .table { --bs-table-bg: transparent; --bs-table-border-color: var(--line); margin: 0; }
    .table thead th { color: var(--muted); font-size: .72rem; text-transform: uppercase;
                      letter-spacing: .1em; border-bottom: 1px solid var(--line); background: #0e1730; }
    .table tbody tr:hover { background: #16223d; }
    tr.row-down { background: rgba(239, 68, 68, .08); }
    .dot { display: inline-block; width: .65rem; height: .65rem; border-radius: 50%; margin-right: .5rem; }
    .dot.up { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.down { background: var(--red); box-shadow: 0 0 8px var(--red); animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .pulse { width: .6rem; height: .6rem; border-radius: 50%; background: var(--green);
             display: inline-block; animation: blink 2s infinite; margin-right: .5rem; }
    .type-badge { background: #1a2745; color: var(--cyan); border: 1px solid var(--line);
                  font-weight: 500; font-size: .75rem; }
    .form-control, .form-select { background: #0b1426; border-color: var(--line); }
    .form-control:focus, .form-select:focus { border-color: var(--cyan); box-shadow: 0 0 0 .2rem rgba(34,211,238,.15); }
    .btn-noc { background: var(--cyan); color: #04202a; font-weight: 600; border: none; }
    .btn-noc:hover { background: #67e8f9; color: #04202a; }
  </style>
</head>
<body>
  <nav class="topbar mb-4">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a class="navbar-brand brand text-decoration-none" href="/">
        <span class="pulse"></span>NOC <small>// Device Inventory</small>
      </a>
      <span class="clock mono" id="clock"></span>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <script>
    function tick() {
      document.getElementById("clock").textContent =
        new Date().toLocaleString("en-GB", { hour12: false }).replace(",", "");
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
